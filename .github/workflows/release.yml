# Build downloadable ChumpMan 11D packages (Windows, macOS, Linux) and attach them to a GitHub
# Release.
#
#   Start it:  Actions > "Release packages" > Run workflow (give a version, e.g. 1.0.1)
#              or push a tag such as v1.0.1
#
# Each package bundles Python and everything ChumpMan 11D uses (built by PyInstaller), so
# people need nothing else. Asset names stay the same from release to release, so
#   https://github.com/zklaas/chumpman11d/releases/latest/download/<name>
# always gives the newest one.
name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            icon: icons/chumpman11d.ico
            sep: ";"
          - os: macos-latest
            icon: icons/chumpman11d.icns
            sep: ":"
          - os: ubuntu-22.04            # older Linux base: the AppImage runs on more systems
            icon: icons/chumpman11d.png
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: python -m pip install pyinstaller PyQt6 PyQt6-WebEngine

      - name: Linux libraries Qt needs (for the start-up check)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2 libportaudio2 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2

      - name: Build with PyInstaller
        shell: bash
        run: >
          pyinstaller --noconfirm --clean --windowed --name ChumpMan11D
          --icon "${{ matrix.icon }}"
          --add-data "icons${{ matrix.sep }}icons"
          --add-data "game.html${{ matrix.sep }}."
          --add-data "index.html${{ matrix.sep }}."
          chumpman11d.py

      - name: Check that it starts
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then EXE=dist/ChumpMan11D.app/Contents/MacOS/ChumpMan11D
          elif [ "$RUNNER_OS" = Windows ]; then EXE=dist/ChumpMan11D/ChumpMan11D.exe
          else EXE=dist/ChumpMan11D/ChumpMan11D; fi
          # the window: still running after 25 s = it started (Python's timeout works everywhere)
          python - "$EXE" <<'PY'
          import subprocess, sys
          try:
              subprocess.run([sys.argv[1]], timeout=25)
          except subprocess.TimeoutExpired:
              print("window started"); sys.exit(0)
          sys.exit("the window closed by itself")
          PY

      - name: Package for Windows (installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$($env:VERSION.TrimStart('v'))" packaging\chumpman11d.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Package for macOS (disk image)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release dmg
          cp -R dist/ChumpMan11D.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "ChumpMan 11D" -srcfolder dmg -ov -format UDZO release/ChumpMan11D-macOS.dmg

      - name: Package for Linux (AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release AppDir/usr/bin
          cp -R dist/ChumpMan11D/. AppDir/usr/bin/
          cp icons/chumpman11d.png AppDir/chumpman11d.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=ChumpMan 11D' \
            'Comment=A hyperspace platformer' 'Exec=ChumpMan11D' 'Icon=chumpman11d' 'Categories=Utility;' > AppDir/chumpman11d.desktop
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/ChumpMan11D" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir release/ChumpMan11D-Linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION#v}"
          ls -la packages
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber
          else
            gh release create "$TAG" packages/* --target "$GITHUB_SHA" \
              --title "ChumpMan 11D ${VERSION#v}" --notes-file packaging/release-notes.md
          fi
